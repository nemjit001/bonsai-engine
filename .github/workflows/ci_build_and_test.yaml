name: CI Build and Test
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  run_tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        presets: [ clang-x64 ]
        include:
          - os: ubuntu-latest
            preset: clang-x64
            build-preset: clang-x64-release
          - os: windows-latest
            preset: clang-x64
            build-preset: clang-x64-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: latest
          vulkan-use-cache: true
          vulkan-components: Vulkan-Headers
      - name: Set up VCPKG
        uses: lukka/run-vcpkg@v11
      - name: Install Linux dependencies
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: >
          sudo apt-get update
          && sudo apt-get install cmake clang
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev
          libxkbcommon-dev libdrm-dev libdbus-1-dev libibus-1.0-dev libudev-dev libusb-1.0-0-dev
      - name: Configure CMake
        run: |
          cmake . --preset ${{ matrix.preset }} -DSDL_UNIX_CONSOLE_BUILD=ON
      - name: Build
        run: |
          cmake --build --preset ${{ matrix.build-preset }}
      - name: Test
        run: |
          cmake --build --preset ${{ matrix.build-preset }} --target test
