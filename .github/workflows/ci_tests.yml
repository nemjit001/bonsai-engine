name: CI Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        configure_preset: [msvc-x64, gcc-x64, clang-x64]
        include:
          - os: windows-latest
            configure_preset: msvc-x64
            build_preset: msvc-x64-release
            build_type: Release
          - os: ubuntu-latest
            configure_preset: gcc-x64
            build_preset: gcc-x64-release
            build_type: Release
          - os: ubuntu-latest
            configure_preset: clang-x64
            build_preset: clang-x64-release
            build_type: Release
        exclude:
          - os: windows-latest
            configure_preset: gcc-x64
          - os: windows-latest
            configure_preset: clang-x64
          - os: ubuntu-latest
            configure_preset: msvc-x64

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        submodules: 'recursive'

    - name: VCPKG Setup
      uses: lukka/run-vcpkg@v11

    - name: Install Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: >
        sudo apt-get install -y \
          cmake clang gcc \
          autoconf autoconf-archive automake libtool libltdl-dev

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -S ${{ github.workspace }}
        -D SDL_UNIX_CONSOLE_BUILD=ON
        --preset ${{ matrix.configure_preset }}

    - name: Build
      run: cmake --build --preset ${{ matrix.build_preset }}

    - name: Test
      # run: cmake --build --preset ${{ matrix.build_preset }} --target test
      run: ctest --build-config ${{ matrix.build_type }} --test-dir .\build\${{ matrix.configure_preset }}
